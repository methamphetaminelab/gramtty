name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.asset }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: x86_64-linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            macos: ""
          - asset: aarch64-macos
            runner: macos-15
            target: aarch64-apple-darwin
            macos: "15.0"
          - asset: x86_64-macos
            runner: macos-26-intel
            target: x86_64-apple-darwin
            macos: "26.0"
          - asset: x86_64-windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            macos: ""
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          test -n "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PKG=gramtty-$version-${{ matrix.asset }}" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          toolchain="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          rustup toolchain install "$toolchain" --profile minimal --target "${{ matrix.target }}"
          rustup default "$toolchain"
          rustc --version

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++-dev libc++abi-dev libclang-dev

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos }}
          GRAMTTY_BUILTIN_API_ID: ${{ secrets.GRAMTTY_API_ID }}
          GRAMTTY_BUILTIN_API_HASH: ${{ secrets.GRAMTTY_API_HASH }}
        run: |
          if [ -z "$GRAMTTY_BUILTIN_API_ID" ] || [ -z "$GRAMTTY_BUILTIN_API_HASH" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "::error::release builds need the GRAMTTY_API_ID and GRAMTTY_API_HASH repository secrets"
              exit 1
            fi
            echo "::warning::GRAMTTY_API_ID/GRAMTTY_API_HASH secrets are not set; building without built-in API keys"
          fi
          cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package
        env:
          COPYFILE_DISABLE: "1"
        run: |
          mkdir -p "dist/$PKG"
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin=gramtty.exe
            archive="$PKG.zip"
          else
            bin=gramtty
            archive="$PKG.tar.gz"
          fi
          cp "target/${{ matrix.target }}/release/$bin" LICENSE NOTICE README.md README.ru.md "dist/$PKG/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$archive" "$PKG"
          else
            tar -czf "$archive" "$PKG"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"

      - name: Build Windows installer
        if: runner.os == 'Windows'
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" /Qp "/DVersion=$VERSION" packaging/gramtty.iss
          cd dist
          sha256sum "$PKG-setup.exe" > "$PKG-setup.exe.sha256"
          cat "$PKG-setup.exe.sha256"

      - name: Test Windows installer and scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($f in 'scripts/install.ps1', 'scripts/install-deps.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors; throw "$f has syntax errors" }
          }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\gramtty'
          Start-Process "dist/$env:PKG-setup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=path' -Wait
          $exe = Join-Path $dir 'gramtty.exe'
          if (-not (Test-Path $exe)) { throw "installer did not put gramtty.exe into $dir" }
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $dir) { throw 'installer did not add gramtty to PATH' }
          $theme = & $exe --print-theme default
          if ($LASTEXITCODE -ne 0 -or -not ($theme -match '\[colors\]')) { $theme; throw "gramtty.exe --print-theme failed ($LASTEXITCODE)" }
          Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw 'uninstaller left gramtty.exe behind' }
          Start-Sleep -Seconds 3
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $dir) { throw 'uninstaller left gramtty in PATH' }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG }}
          path: |
            dist/${{ env.PKG }}.tar.gz
            dist/${{ env.PKG }}.zip
            dist/${{ env.PKG }}-setup.exe
            dist/${{ env.PKG }}-setup.exe.sha256
            dist/${{ env.PKG }}.*.sha256
          if-no-files-found: error

  release:
    needs: build
    if: ${{ !cancelled() && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: gramtty-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/*.exe dist/*.sha256 --clobber

  formula:
    needs: release
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Update Homebrew formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          sh scripts/update-formula.sh "$version"
          if git diff --quiet -- Formula/gramtty.rb; then
            echo "Formula already at $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Homebrew formula to $version" -- Formula/gramtty.rb
          git push origin HEAD:main

  aur:
    needs: release
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        pkg: [gramtty-bin, gramtty]
    env:
      PKG: ${{ matrix.pkg }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check AUR key
        id: key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set, AUR update of $PKG skipped"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install tools
        if: steps.key.outputs.ready == 'true'
        run: pacman -Syu --noconfirm --needed git openssh pacman-contrib

      - uses: actions/checkout@v7
        if: steps.key.outputs.ready == 'true'

      - name: Set up SSH
        if: steps.key.outputs.ready == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 /aur-ssh
          (umask 077 && printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /aur-ssh/key)
          chmod 600 /aur-ssh/key
          cat > /aur-ssh/known_hosts <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLMiLrP8pVi5BFX2i3vepSUnpedeiewE5XptnUnau+ZoeUOPkpoCgZZuYfpaIQfhhJJI5qgnjJmr4hyJbe/zxow=
          EOF
          echo "GIT_SSH_COMMAND=ssh -i /aur-ssh/key -o IdentitiesOnly=yes -o UserKnownHostsFile=/aur-ssh/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: Update AUR package
        if: steps.key.outputs.ready == 'true'
        env:
          AUR_GIT_NAME: ${{ vars.AUR_GIT_NAME || 'github-actions[bot]' }}
          AUR_GIT_EMAIL: ${{ vars.AUR_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
        run: |
          version="${TAG#v}"
          useradd -m builder
          install -m 755 scripts/update-aur.sh /usr/local/bin/update-aur.sh
          git config --global --add safe.directory /home/builder/aur
          git clone "ssh://aur@aur.archlinux.org/$PKG.git" /home/builder/aur
          chown -R builder:builder /home/builder/aur
          runuser -u builder -- update-aur.sh "$version" /home/builder/aur
          cd /home/builder/aur
          if git diff --quiet -- PKGBUILD .SRCINFO; then
            echo "$PKG already at $version"
            exit 0
          fi
          git add PKGBUILD .SRCINFO
          git -c user.name="$AUR_GIT_NAME" -c user.email="$AUR_GIT_EMAIL" commit -m "Update to $version"
          git push origin HEAD:master
