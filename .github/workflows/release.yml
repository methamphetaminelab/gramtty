name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.asset }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: x86_64-linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            macos: ""
          - asset: aarch64-macos
            runner: macos-15
            target: aarch64-apple-darwin
            macos: "15.0"
          - asset: x86_64-macos
            runner: macos-26-intel
            target: x86_64-apple-darwin
            macos: "26.0"
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          test -n "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PKG=gramtty-$version-${{ matrix.asset }}" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          toolchain="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          rustup toolchain install "$toolchain" --profile minimal --target "${{ matrix.target }}"
          rustup default "$toolchain"
          rustc --version

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++-dev libc++abi-dev libclang-dev

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos }}
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package
        env:
          COPYFILE_DISABLE: "1"
        run: |
          mkdir -p "dist/$PKG"
          cp "target/${{ matrix.target }}/release/gramtty" LICENSE NOTICE README.md README.ru.md "dist/$PKG/"
          cd dist
          tar -czf "$PKG.tar.gz" "$PKG"
          if command -v sha256sum >/dev/null; then
            sha256sum "$PKG.tar.gz" > "$PKG.tar.gz.sha256"
          else
            shasum -a 256 "$PKG.tar.gz" > "$PKG.tar.gz.sha256"
          fi
          cat "$PKG.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG }}
          path: |
            dist/${{ env.PKG }}.tar.gz
            dist/${{ env.PKG }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    if: ${{ !cancelled() && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: gramtty-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber
