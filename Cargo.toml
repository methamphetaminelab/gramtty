[package]
name = "gramtty"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A terminal Telegram client with concord-like UX"
license = "GPL-3.0-or-later"

[dependencies]
tdlib-rs = { version = "1.4.0", features = ["download-tdlib", "static"] }
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "fs"] }
futures = "0.3.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.2"
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
qrcode = { version = "0.14", default-features = false }
unicode-width = "0.2.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
ratatui-image = { version = "11.0.8", default-features = false, features = ["crossterm"] }
thorvg = { version = "0.5.1", default-features = false, features = ["vendored", "lottie"] }
flate2 = "1.1.5"
base64 = "0.22.1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
